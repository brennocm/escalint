name: visual-baselines

# Regenerates the visual regression baselines inside the pinned Playwright
# container (ADR 0019) and uploads them as an artifact. Download it, review
# the images and commit them; nothing is pushed from here.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: Update visual baselines (Playwright container)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - working-directory: web
        run: pnpm install --frozen-lockfile
      - working-directory: web
        run: pnpm build
      - working-directory: web
        run: pnpm e2e:visual:update
        env:
          CI: "true"
          HOME: /root
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines
          path: web/tests/visual/__screenshots__
          if-no-files-found: error
