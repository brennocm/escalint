version: "2"

run:
  # Tests and CI build without the frontend; see ADR 0002.
  build-tags:
    - noui

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - exhaustive
    - gocritic
    - gosec
    - misspell
    - nilerr
    - prealloc
    - revive
  settings:
    exhaustive:
      default-signifies-exhaustive: false
    misspell:
      locale: US
      # MITRE (ATT&CK) is a name, not a misspelling of "miter".
      ignore-rules: [mitre]
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: error-strings
        - name: indent-error-flow
        - name: unused-parameter
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Tests read fixtures from testdata/ by name; G304 (file inclusion via a
      # variable path) does not apply to that.
      - path: _test\.go
        linters: [gosec]
        text: G304
      # Tests use seeded math/rand on purpose: generated graphs must be
      # reproducible, which crypto/rand cannot be.
      - path: _test\.go
        linters: [gosec]
        text: G404
      # Test fixtures are full of IAM condition keys and fake account data
      # ("token.actions…:aud") that G101's credential heuristics flag.
      - path: _test\.go
        linters: [gosec]
        text: G101
      - path: _test\.go
        linters: [gosec]
        text: G124
      # Preallocation hints add noise to table-driven tests.
      - path: _test\.go
        linters: [prealloc]

formatters:
  enable:
    - gofumpt
